<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu - Cửa Hàng Nội Thất</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="login-page">
    <div class="login-container">
        <h2>Đổi mật khẩu</h2>
        <p class="subtitle">Cập nhật mật khẩu mới cho tài khoản của bạn</p>

        <form id="changePasswordForm">
            <div class="input-group">
                <label for="new-password">Mật khẩu mới</label>
                <input type="password" id="new-password" placeholder="••••••••" required>
                <div id="passwordChecklist"></div>
            </div>

            <div class="input-group">
                <label for="confirm-password">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirm-password" placeholder="••••••••" required>
                <div id="confirmPasswordError" class="field-error"></div>
            </div>

            <div id="formMessage" class="field-error"></div>

            <button type="submit" class="btn-primary">Đổi mật khẩu</button>

            <div class="auth-links">
                <p><a href="index.html">Quay lại</a></p>
            </div>
        </form>
    </div>

    <script src="js/validators.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="change-password.js"></script>
</body>

</html>
