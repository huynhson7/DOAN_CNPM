<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input[type="password"]:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.3); }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; transition: background 0.3s; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Tạo mật khẩu mới</h2>
        <p class="subtitle">Tài khoản: <strong id="lblEmail" style="color: #007bff;">Đang tải...</strong></p>

        <div class="form-group">
            <label for="txtNewPassword">Mật khẩu mới:</label>
            <input type="password" id="txtNewPassword" placeholder="Nhập mật khẩu mới..." required>
        </div>
        
        <div class="form-group">
            <label for="txtConfirmPassword">Xác nhận mật khẩu mới:</label>
            <input type="password" id="txtConfirmPassword" placeholder="Nhập lại mật khẩu mới..." required>
        </div>
        
        <button onclick="datLaiMatKhau()">Xác nhận đổi mật khẩu</button>
    </div>

    <script>
        const apiUrl = 'http://localhost:5129'; 
        const emailCanReset = localStorage.getItem("resetEmail");

        window.onload = function() {
            if (!emailCanReset) {
                alert("Không tìm thấy thông tin xác thực. Hệ thống sẽ quay lại trang Quên mật khẩu.");
                window.location.href = "forgot-password.html";
            } else {
                document.getElementById('lblEmail').innerText = emailCanReset;
            }
        }

        async function datLaiMatKhau() {
            const newPassword = document.getElementById('txtNewPassword').value;
            const confirmPassword = document.getElementById('txtConfirmPassword').value;

            if (!newPassword || !confirmPassword) {
                alert("Vui lòng điền đầy đủ thông tin!");
                return;
            }

            if (newPassword !== confirmPassword) {
                alert("Mật khẩu nhập lại không khớp!");
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/api/Auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: emailCanReset, 
                        newPassword: newPassword 
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    alert("Đổi mật khẩu thành công! Hệ thống sẽ chuyển về trang đăng nhập.");
                    localStorage.removeItem("resetEmail"); // Xóa dữ liệu tạm
                    window.location.href = "login.html"; // Chuyển về trang đăng nhập
                } else {
                    alert("Lỗi: " + result.message);
                }
            } catch (error) {
                alert("Lỗi kết nối đến server!");
            }
        }
    </script>
</body>
</html>
