server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # [SỬA LẦN 2] Dùng "$scheme://$http_host/..." thay vì chỉ "/html/index.html".
    # Lý do: nếu chỉ trả về đường dẫn bắt đầu bằng "/", Nginx tự ghép thành
    # "$scheme://$host/..." - mà $host KHÔNG chứa cổng (luôn mặc định cổng 80),
    # nên trình duyệt bị điều hướng nhầm sang "http://localhost/..." (cổng 80,
    # không map cổng nào ở đó) thay vì giữ đúng cổng 5500 đang truy cập.
    # $http_host giữ nguyên "host:port" từ header Host của request gốc.
    location = / {
        return 302 $scheme://$http_host/html/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}