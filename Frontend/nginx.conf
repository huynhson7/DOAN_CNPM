server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Trang chủ dự án nằm ở html/index.html (không phải index.html ở gốc)
    # nên khi vào "/" tự động chuyển hướng tới đúng trang.
    location = / {
        return 302 /html/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Tắt cache khi test để luôn thấy bản mới nhất sau mỗi lần build lại image.
    # Khi đã ổn định, có thể xoá đoạn này để trình duyệt cache css/js/img bình thường.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
