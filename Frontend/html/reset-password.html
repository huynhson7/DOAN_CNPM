<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - Cửa Hàng Nội Thất</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="login-page">
    <div class="login-container">
        <h2>Đặt lại mật khẩu</h2>
        <p class="subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>

        <form id="resetPasswordForm">
            <div class="input-group">
                <label for="new-password">Mật khẩu mới</label>
                <input type="password" id="new-password" placeholder="••••••••" required>
                <div id="passwordChecklist"></div>
            </div>

            <div class="input-group">
                <label for="confirm-password">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirm-password" placeholder="••••••••" required>
                <div id="confirmPasswordError" class="field-error"></div>
            </div>

            <div id="formMessage" class="field-error"></div>

            <button type="submit" class="btn-primary">Đặt lại mật khẩu</button>

            <div class="auth-links">
                <p><a href="login.html">Quay lại trang Đăng nhập</a></p>
            </div>
        </form>
    </div>

    <script src="../js/validators.js"></script>
    <script src="../js/reset-password.js"></script>
</body>

</html>
