<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng Ký - Cửa Hàng Nội Thất Hiện Đại</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/register.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="login-page">
    <div class="login-container">
        <h2>Tạo tài khoản mới</h2>
        <p class="subtitle">Bắt đầu không gian sống mơ ước của bạn</p>

        <form id="registerForm">
            <div class="input-group">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" placeholder="VD: Nguyễn Văn A" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="VD: [email protected]" required>
            </div>

            <div class="input-group">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" placeholder="Nhập số điện thoại" required>
            </div>

            <div class="input-group">
                <label for="reg-username">Tên đăng nhập</label>
                <input type="text" id="reg-username" placeholder="4-20 ký tự: chữ, số, dấu gạch dưới" required>
                <div id="usernameError" class="field-error"></div>
            </div>

            <div class="input-group">
                <label for="reg-password">Mật khẩu</label>
                <input type="password" id="reg-password" placeholder="••••••••" required>
                <div id="passwordChecklist"></div>
            </div>

            <div class="input-group">
                <label for="reg-confirm-password">Xác nhận mật khẩu</label>
                <input type="password" id="reg-confirm-password" placeholder="••••••••" required>
                <div id="confirmPasswordError" class="field-error"></div>
            </div>

            <div id="registerError" class="field-error"></div>

            <button type="submit"  class="btn-primary">Đăng Ký</button>

            <div class="divider"><span>Hoặc</span></div>
            <div class="google-btn-wrapper">
                <div id="googleSignInButton"></div>
            </div>
            <div class="auth-links">
                <p>Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a></p>
            </div>
        </form>
    </div>

    <!-- Modal Thông Báo Đăng Ký Thành Công -->
    <div id="registerSuccessModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-check-circle" style="color:#2ecc71;"></i> Đăng ký thành công</h3>
            </div>
            <div class="modal-body" style="text-align:center;">
                <p style="font-size:15px; color:var(--text-color, #444);">
                    Tài khoản của bạn đã được tạo thành công.<br>
                    Vui lòng đăng nhập để tiếp tục sử dụng.
                </p>
            </div>
            <div class="modal-footer" style="justify-content:center;">
                <button type="button" id="btnGoToLogin" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Chuyển hướng đăng nhập
                </button>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="../js/validators.js"></script>
    <script src="../js/register.js"></script>
</body>

</html>
