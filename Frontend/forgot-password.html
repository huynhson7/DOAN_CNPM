<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên Mật Khẩu - Cửa Hàng Nội Thất Hiện Đại</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="login-page">

    <div class="login-container">
        <h2>Quên mật khẩu</h2>
        <p class="subtitle">Nhập email để nhận mã xác nhận đặt lại mật khẩu</p>

        <!-- Phần 1: Nhập Email -->
        <div class="input-group">
            <label for="txtEmail">Email đã đăng ký</label>
            <input type="email" id="txtEmail" placeholder="ví dụ: email@gmail.com" required>
        </div>

        <button id="btnSendOtp" class="btn-primary" onclick="guiMaOTP()">Gửi mã xác nhận</button>

        <!-- Phần 2: Nhập OTP (Tự động hiện ra sau khi gửi email thành công) -->
        <div id="otpSection">
            <div class="input-group">
                <label for="txtOtp">Mã OTP (6 số)</label>
                <input type="text" id="txtOtp" placeholder="Nhập mã xác nhận..." maxlength="6">
            </div>

            <div class="timer-container">
                <span id="timerText">Gửi lại mã sau: <strong id="countdown">60</strong>s</span>
                <button id="btnResend" onclick="guiLaiOTP()">Gửi lại mã xác nhận</button>
            </div>

            <button id="btnVerify" class="btn-accent" onclick="xacNhanOTP()">Xác nhận OTP</button>
        </div>

        <!-- Quay lại đăng nhập -->
        <div class="auth-links">
            <p>Đã nhớ mật khẩu? <a href="login.html">Quay lại đăng nhập</a></p>
        </div>
    </div>

    <script>
        // Đã cập nhật đúng Port của bạn
        const apiUrl = 'http://localhost:5129';
        let countdownInterval;

        async function guiMaOTP() {
            const email = document.getElementById('txtEmail').value;
            if (!email) {
                alert("Vui lòng nhập email!");
                return;
            }

            const btnSend = document.getElementById('btnSendOtp');
            btnSend.innerText = "Đang gửi...";
            btnSend.disabled = true;

            try {
                const response = await fetch(`${apiUrl}/api/Auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    document.getElementById('otpSection').style.display = 'block';
                    document.getElementById('txtEmail').disabled = true;

                    batDauDemNguoc();
                } else {
                    alert("Lỗi: " + result.message);
                    btnSend.disabled = false;
                    btnSend.innerText = "Gửi mã xác nhận";
                }
            } catch (error) {
                alert("Lỗi kết nối đến server! Hãy chắc chắn Backend đang chạy.");
                btnSend.disabled = false;
                btnSend.innerText = "Gửi mã xác nhận";
            }
        }

        function batDauDemNguoc() {
            let timeLeft = 60;
            document.getElementById('btnResend').style.display = 'none';
            document.getElementById('timerText').style.display = 'inline';
            document.getElementById('countdown').innerText = timeLeft;

            countdownInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown').innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('timerText').style.display = 'none';
                    document.getElementById('btnResend').style.display = 'inline-block';
                    document.getElementById('btnSendOtp').disabled = false;
                    document.getElementById('btnSendOtp').innerText = "Gửi lại mã";
                }
            }, 1000);
        }

        function guiLaiOTP() {
            clearInterval(countdownInterval);
            guiMaOTP();
        }

        async function xacNhanOTP() {
            const email = document.getElementById('txtEmail').value;
            const otp = document.getElementById('txtOtp').value;

            if (!otp) {
                alert("Vui lòng nhập mã OTP!");
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/api/Auth/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, otp: otp })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    localStorage.setItem("resetEmail", email);
                    window.location.href = "reset-password.html";
                } else {
                    alert("Lỗi: " + result.message);
                }
            } catch (error) {
                alert("Lỗi kết nối đến server!");
            }
        }
    </script>
</body>
</html>
