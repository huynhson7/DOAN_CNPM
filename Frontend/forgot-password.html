<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Khôi phục mật khẩu - Cửa Hàng Nội Thất</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="login-page">
    <div class="login-container">
        <h2>Quên mật khẩu</h2>
        <p class="subtitle">Nhập email của bạn để nhận liên kết đặt lại mật khẩu</p>

        <form id="forgotPasswordForm">
            <div class="input-group">
                <label for="email">Địa chỉ Email</label>
                <input type="email" id="email" placeholder="Nhập email đăng ký tài khoản" required>
            </div>

            <!-- Thông báo kết quả hiển thị ngay trong trang - không dùng Alert -->
            <div id="formMessage" class="field-error"></div>

            <button type="submit" class="btn-primary">Gửi liên kết đặt lại mật khẩu</button>

            <div class="auth-links">
                <p><a href="login.html">Quay lại trang Đăng nhập</a></p>
            </div>
        </form>
    </div>

    <script src="forgot-password.js"></script>
</body>

</html>
