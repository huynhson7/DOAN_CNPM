<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        input[type="email"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input[type="email"]:focus, input[type="text"]:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.3); }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* CSS cho khu vực OTP bị ẩn lúc đầu */
        #otpSection { display: none; margin-top: 25px; border-top: 1px dashed #ccc; padding-top: 20px; }
        .timer-container { text-align: right; margin-top: 5px; font-size: 13px; }
        #timerText { color: #d9534f; }
        #btnResend { background: none; border: none; color: #007bff; text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; display: none; width: auto; font-weight: normal; margin-top: 5px; }
        #btnResend:hover { background: none; color: #0056b3; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Quên mật khẩu</h2>
        
        <!-- Phần 1: Nhập Email -->
        <div class="form-group">
            <label for="txtEmail">Nhập Email đã đăng ký:</label>
            <input type="email" id="txtEmail" placeholder="ví dụ: email@gmail.com" required>
            <button id="btnSendOtp" onclick="guiMaOTP()">Gửi mã xác nhận</button>
        </div>

        <!-- Phần 2: Nhập OTP (Tự động hiện ra sau khi gửi email thành công) -->
        <div id="otpSection">
            <div class="form-group">
                <label for="txtOtp">Nhập mã OTP (6 số):</label>
                <input type="text" id="txtOtp" placeholder="Nhập mã xác nhận..." maxlength="6">
            </div>
            
            <div class="timer-container">
                <span id="timerText">Gửi lại mã sau: <strong id="countdown">60</strong>s</span>
                <button id="btnResend" onclick="guiLaiOTP()">Gửi lại mã xác nhận</button>
            </div>
            
            <button id="btnVerify" onclick="xacNhanOTP()" style="background-color: #28a745;">Xác nhận OTP</button>
        </div>
    </div>

    <script>
        // Đã cập nhật đúng Port của bạn
        const apiUrl = 'http://localhost:5129'; 
        let countdownInterval;

        async function guiMaOTP() {
            const email = document.getElementById('txtEmail').value;
            if (!email) {
                alert("Vui lòng nhập email!");
                return;
            }

            // Đổi text nút bấm để báo hiệu đang gửi
            const btnSend = document.getElementById('btnSendOtp');
            btnSend.innerText = "Đang gửi...";
            btnSend.disabled = true;

            try {
                const response = await fetch(`${apiUrl}/api/Auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    // THÀNH CÔNG: Hiện khu vực nhập OTP, khóa ô nhập email lại
                    document.getElementById('otpSection').style.display = 'block';
                    document.getElementById('txtEmail').disabled = true;
                    
                    batDauDemNguoc();
                } else {
                    alert("Lỗi: " + result.message);
                    btnSend.disabled = false;
                    btnSend.innerText = "Gửi mã xác nhận";
                }
            } catch (error) {
                alert("Lỗi kết nối đến server! Hãy chắc chắn Backend đang chạy.");
                btnSend.disabled = false;
                btnSend.innerText = "Gửi mã xác nhận";
            }
        }

        function batDauDemNguoc() {
            let timeLeft = 60;
            document.getElementById('btnResend').style.display = 'none';
            document.getElementById('timerText').style.display = 'inline';
            document.getElementById('countdown').innerText = timeLeft;

            countdownInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown').innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    // Hết 60s -> Hiện nút Gửi lại, ẩn chữ đếm ngược
                    document.getElementById('timerText').style.display = 'none';
                    document.getElementById('btnResend').style.display = 'inline-block';
                    document.getElementById('btnSendOtp').disabled = false;
                    document.getElementById('btnSendOtp').innerText = "Gửi lại mã";
                }
            }, 1000);
        }

        function guiLaiOTP() {
            clearInterval(countdownInterval);
            guiMaOTP(); 
        }

        async function xacNhanOTP() {
            const email = document.getElementById('txtEmail').value;
            const otp = document.getElementById('txtOtp').value;

            if (!otp) {
                alert("Vui lòng nhập mã OTP!");
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/api/Auth/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, otp: otp })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    // Lưu email vào Cache của trình duyệt để trang sau sử dụng
                    localStorage.setItem("resetEmail", email);
                    // Chuyển sang trang đặt lại mật khẩu
                    window.location.href = "reset-password.html";
                } else {
                    alert("Lỗi: " + result.message);
                }
            } catch (error) {
                alert("Lỗi kết nối đến server!");
            }
        }
    </script>
</body>
</html>
