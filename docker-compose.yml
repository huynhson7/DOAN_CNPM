services:
  # 1) SQL Server - lưu toàn bộ dữ liệu (KHÔNG lưu ảnh, ảnh nằm trên Cloudinary)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cnpm_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      # Mount thẳng thư mục Database (đã có sẵn file "BAK") vào container SQL Server,
      # để lệnh RESTORE DATABASE đọc được file này. KHÔNG cần tạo thư mục con nào thêm.
      - ./Backend/Database:/var/opt/mssql/backup:ro
    healthcheck:
      # Dùng chính sqlcmd có sẵn trong image để kiểm tra DB đã nhận kết nối chưa.
      # (Không dùng "exec 3<>/dev/tcp/..." vì cú pháp đó chỉ chạy trên bash,
      # trong khi CMD-SHELL của image này chạy bằng sh -> luôn báo unhealthy sai.)
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # 2) Container tạm: chỉ chạy 1 lần để tạo database + bảng + dữ liệu mẫu
  #    từ file Backend/Database/SqlCNPM.sql, sau đó tự thoát.
  db-init:
    # Dùng chung image SQL Server (đã có sẵn sqlcmd tại /opt/mssql-tools18/bin bên trong),
    # KHÔNG dùng image "mssql-tools18" riêng vì image đó không tồn tại trên Docker Hub/MCR.
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cnpm_db_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_HOST: sqlserver
      SA_PASSWORD: ${SA_PASSWORD}
      USE_BACKUP: ${USE_BACKUP}
    volumes:
      - ./Backend/Database:/scripts:ro
    entrypoint: ["bash", "/scripts/init-db.sh"]
    restart: "no"

  # 3) Backend .NET 9 Web API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cnpm_backend
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5129

      # Nối tới SQL Server bằng tên service "sqlserver" trong network Docker,
      # dùng SQL Authentication (sa) thay vì Trusted_Connection (chỉ dùng được trên Windows).
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=HTQLCHBNT;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"

      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "http://localhost:5129"
      Jwt__Audience: "http://localhost:5129"

      # QUAN TRỌNG: ảnh sản phẩm lưu trên Cloudinary (Cloud), không lưu trong container/volume.
      # Điền 3 giá trị này trong file .env - lấy từ Cloudinary Dashboard.
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      Cloudinary__RootFolder: "Do_Noi_That"

      Smtp__SenderEmail: ${SMTP_SENDER_EMAIL}
      Smtp__SenderAppPassword: ${SMTP_SENDER_APP_PASSWORD}

      # Cho phép Frontend (container Nginx, cổng 8080) gọi API - phải khớp cổng publish ở dưới.
      Frontend__AllowedOrigins__0: "http://localhost:8080"
      Frontend__AllowedOrigins__1: "http://127.0.0.1:8080"
    ports:
      - "5129:5129"
    restart: unless-stopped

  # 4) Frontend tĩnh (html/css/js) phục vụ qua Nginx
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: cnpm_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  sqlserver_data: